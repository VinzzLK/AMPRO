name: VinzzMod - Build Alight Motion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install apksigner + zipalign (build-tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner

      - name: Verify patched source exists
        run: |
          test -d patched/ || (echo "ERROR: patched/ folder not found. Put decompiled+patched source here." && exit 1)
          test -f patched/AndroidManifest.xml || (echo "ERROR: AndroidManifest.xml missing in patched/" && exit 1)
          echo "Source OK"

      - name: Build APK with apktool
        run: |
          apktool b patched/ -o AlightMod_unsigned.apk --use-aapt2
          echo "Build done: $(du -sh AlightMod_unsigned.apk)"

      - name: Zipalign
        run: |
          zipalign -v 4 AlightMod_unsigned.apk AlightMod_aligned.apk
          echo "Zipalign done"

      - name: Generate debug keystore (if not present)
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkey -v \
              -keystore keystore.jks \
              -alias vinzzmod \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass vinzzmod123 \
              -keypass vinzzmod123 \
              -dname "CN=VinzzMod, OU=Modding, O=Vinnz, L=ID, S=ID, C=ID"
            echo "Keystore generated"
          else
            echo "Using existing keystore.jks"
          fi

      - name: Sign APK
        run: |
          apksigner sign \
            --ks keystore.jks \
            --ks-alias vinzzmod \
            --ks-pass pass:vinzzmod123 \
            --key-pass pass:vinzzmod123 \
            --out AlightMod_VinzzMod_signed.apk \
            AlightMod_aligned.apk
          apksigner verify AlightMod_VinzzMod_signed.apk
          echo "Sign OK"

      - name: Rename with version
        run: |
          TAG="${{ github.event.inputs.version_tag || 'latest' }}"
          mv AlightMod_VinzzMod_signed.apk AlightMod_VinzzMod_${TAG}.apk
          echo "APK_NAME=AlightMod_VinzzMod_${TAG}.apk" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlightMod-VinzzMod
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          body: |
            ## AlightMod by @Vinnz_
            
            ### Patch List
            - ✅ Premium Unlock (permanent)
            - ✅ Remove Watermark
            - ✅ No Ads (AppLovin + AdMob + Facebook)
            - ✅ Custom Notif @Vinnz_
            - ✅ XML Preset 50MB+ Support
            - ✅ Reverse Video (lossless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
