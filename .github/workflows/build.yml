name: VinzzMod - Build Alight Motion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0)'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          APKTOOL_VERSION="2.9.3"
          curl -sL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o /usr/local/bin/apktool.jar

          printf '#!/bin/bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' \
            > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install zipalign & apksigner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner

      - name: Verify source
        run: |
          test -f AndroidManifest.xml || \
            (echo "ERROR: AndroidManifest.xml tidak ditemukan di root repo" && exit 1)
          test -d smali/ || \
            (echo "ERROR: folder smali/ tidak ditemukan" && exit 1)
          echo "Source OK - building from root"

      - name: Build APK
        run: |
          # Build dari root repo langsung (bukan subfolder patched/)
          apktool b . -o AlightMod_unsigned.apk --use-aapt2
          echo "Build selesai: $(du -sh AlightMod_unsigned.apk)"

      - name: Zipalign
        run: |
          zipalign -v 4 AlightMod_unsigned.apk AlightMod_aligned.apk
          echo "Zipalign OK"

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias vinzzmod \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass vinzzmod123 \
            -keypass vinzzmod123 \
            -dname "CN=VinzzMod,OU=Mod,O=Vinnz,L=ID,S=ID,C=ID" \
            -noprompt
          echo "Keystore generated"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks keystore.jks \
            --ks-alias vinzzmod \
            --ks-pass pass:vinzzmod123 \
            --key-pass pass:vinzzmod123 \
            --out AlightMod_VinzzMod_signed.apk \
            AlightMod_aligned.apk
          apksigner verify --verbose AlightMod_VinzzMod_signed.apk
          echo "Sign OK"

      - name: Rename APK
        run: |
          TAG="${{ github.event.inputs.version_tag || 'latest' }}"
          mv AlightMod_VinzzMod_signed.apk "AlightMod_VinzzMod_${TAG}.apk"
          echo "APK_NAME=AlightMod_VinzzMod_${TAG}.apk" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlightMod-VinzzMod
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          body: |
            ## AlightMod by @Vinnz_
            - ✅ Premium Unlock (permanent)
            - ✅ Remove Watermark
            - ✅ No Ads
            - ✅ Custom Notif @Vinnz_
            - ✅ XML Preset 50MB+
            - ✅ Reverse Video (lossless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
